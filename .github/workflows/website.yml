name: Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            packages/ui/package-lock.json

      - run: npm --prefix website ci
      - run: npm --prefix website run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload static site
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
        run: |
          set -euo pipefail
          tar -C website/dist -czf /tmp/contenox-website.tar.gz .
          gcloud compute scp /tmp/contenox-website.tar.gz "${GCP_INSTANCE}:/tmp/contenox-website.tar.gz" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" --tunnel-through-iap

      - name: Replace live site
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          GCP_WEBSITE_PATH: ${{ vars.GCP_WEBSITE_PATH }}
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_INSTANCE" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" --tunnel-through-iap \
            --command="sudo mkdir -p '$GCP_WEBSITE_PATH' && sudo tar -xzf /tmp/contenox-website.tar.gz -C '$GCP_WEBSITE_PATH' && sudo chown -R root:root '$GCP_WEBSITE_PATH' && rm -f /tmp/contenox-website.tar.gz"

      - name: Verify live site
        run: |
          set -euo pipefail
          curl -fsS https://contenox.com/ | grep -q 'Download Contenox'
          curl -fsS https://contenox.com/contenox-release.asc | gpg --show-keys --with-colons | grep -q '062E1120E238FC6EC74993D95F6BCC9B4C0CF024'
