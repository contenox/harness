name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/harness/package-lock.json
            packages/ui/package-lock.json
            packages/acp-client/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm awscli

      - name: Install AWS CLI
        if: runner.os == 'Windows'
        run: choco install awscli -y --no-progress

      - name: Install AWS CLI
        if: runner.os == 'macOS'
        run: command -v aws >/dev/null || brew install awscli

      - run: make install-web
      - run: make desktop-package

      - name: Import release signing key
        if: runner.os == 'Linux'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          FPR=$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          test "$FPR" = "$RELEASE_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"

      - name: Write release public key
        if: runner.os == 'Linux'
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > "$RUNNER_TEMP/release.asc"

      - name: Sign Linux package
        if: runner.os == 'Linux'
        run: python scripts/release-sign.py desktop/dist --gnupg-home "$GNUPGHOME" --public-key "$RUNNER_TEMP/release.asc"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish platform to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_RELEASE_PREFIX: ${{ vars.S3_RELEASE_PREFIX }}
          S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE }}
        run: python scripts/publish-platform.py

  index:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install release tools
        run: sudo apt-get update -qq && sudo apt-get install -y rpm awscli

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Import release signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          FPR=$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          test "$FPR" = "$RELEASE_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"

      - name: Write release public key
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > "$RUNNER_TEMP/release.asc"

      - name: Build release index
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_RELEASE_PREFIX: ${{ vars.S3_RELEASE_PREFIX }}
          S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "'v' + require('./desktop/package.json').version")
          TAG="$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
          python3 scripts/publish-desktop-index.py \
            --version "$VERSION" \
            --bucket "$S3_BUCKET" \
            --prefix "$S3_RELEASE_PREFIX" \
            --public-base "$S3_PUBLIC_BASE" \
            --gnupg-home "$GNUPGHOME" \
            --public-key "$RUNNER_TEMP/release.asc"

      - name: Create GitHub release link
        env:
          GH_TOKEN: ${{ github.token }}
          S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "'v' + require('./desktop/package.json').version")
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Installers are published at:

          https://contenox.com/#download

          Release index:
          ${S3_PUBLIC_BASE}/index.json
          NOTES
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Contenox ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
