name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            packages/harness/package-lock.json
            packages/acp-client/package-lock.json
            website/package-lock.json
            desktop/package-lock.json

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm

      - name: Import release signing key
        if: runner.os == 'Linux'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          FPR=$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          test "$FPR" = "$RELEASE_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          echo "RELEASE_GPG_FINGERPRINT=$FPR" >> "$GITHUB_ENV"

      - run: make install-web
      - run: make desktop-package

      - name: Sign RPM
        if: runner.os == 'Linux'
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          rpm=$(find desktop/dist -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$rpm"
          rpmsign --define "_gpg_name $RELEASE_GPG_FINGERPRINT" --define "_gpg_path $GNUPGHOME" --addsign "$rpm"
          printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > "$RUNNER_TEMP/release.asc"
          rpm --dbpath "$RUNNER_TEMP/rpmdb" --initdb
          rpm --dbpath "$RUNNER_TEMP/rpmdb" --import "$RUNNER_TEMP/release.asc"
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --checksig "$rpm" | tee "$RUNNER_TEMP/rpmcheck.txt"
          grep -q 'signatures OK' "$RUNNER_TEMP/rpmcheck.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: contenox-desktop-${{ runner.os }}
          path: |
            desktop/dist/Contenox-*
            desktop/dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: contenox-desktop-*
          merge-multiple: true
          path: artifacts

      - name: Install RPM tools
        run: sudo apt-get update -qq && sudo apt-get install -y rpm

      - name: Import release signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          FPR=$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          test "$FPR" = "$RELEASE_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          echo "RELEASE_GPG_FINGERPRINT=$FPR" >> "$GITHUB_ENV"

      - name: Stage release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p release
          cp artifacts/Contenox-* release/
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag $TAG already exists; refusing to build a second release" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to replace it" >&2
            exit 1
          fi

      - name: Sign RPM
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          rpm=$(find release -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$rpm"
          rpmsign --define "_gpg_name $RELEASE_GPG_FINGERPRINT" --define "_gpg_path $GNUPGHOME" --addsign "$rpm"
          printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > "$RUNNER_TEMP/release.asc"
          rpm --dbpath "$RUNNER_TEMP/rpmdb" --initdb
          rpm --dbpath "$RUNNER_TEMP/rpmdb" --import "$RUNNER_TEMP/release.asc"
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --checksig "$rpm" | tee "$RUNNER_TEMP/rpmcheck.txt"
          grep -q 'signatures OK' "$RUNNER_TEMP/rpmcheck.txt"
          echo "RPM_ASSET=$rpm" >> "$GITHUB_ENV"

      - name: Generate signatures and checksums
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cd release
          find . -name SHA256SUMS -delete
          sha256sum Contenox-* > SHA256SUMS
          gpg --batch --homedir "$GNUPGHOME" --local-user "$RELEASE_GPG_FINGERPRINT" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          for artifact in Contenox-*; do
            gpg --batch --homedir "$GNUPGHOME" --local-user "$RELEASE_GPG_FINGERPRINT" --armor --detach-sign --output "$artifact.asc" "$artifact"
            test -s "$artifact.asc"
          done
          printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > contenox-release.asc

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          gh release create "$TAG" release/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Contenox v${VERSION}" \
            --generate-notes

      - name: Verify uploaded RPM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p verify
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".rpm")) | .id' | head -1)
          test -n "$asset_id"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > verify/uploaded.rpm
          printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > "$RUNNER_TEMP/release.asc"
          rpm --dbpath "$RUNNER_TEMP/verifydb" --initdb
          rpm --dbpath "$RUNNER_TEMP/verifydb" --import "$RUNNER_TEMP/release.asc"
          rpmkeys --dbpath "$RUNNER_TEMP/verifydb" --checksig verify/uploaded.rpm | tee "$RUNNER_TEMP/uploaded-rpmcheck.txt"
          grep -q 'signatures OK' "$RUNNER_TEMP/uploaded-rpmcheck.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

      - name: Delete draft on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
            if [ -n "$release_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
          fi

      - name: Rebuild website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run Website.yml --repo "$GITHUB_REPOSITORY" --ref main
