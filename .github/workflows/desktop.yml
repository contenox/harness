name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - packages/**
      - runtime.lock.json
      - scripts/fetch-runtime.mjs
      - Makefile
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            packages/harness/package-lock.json
            packages/acp-client/package-lock.json
            website/package-lock.json
            desktop/package-lock.json

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm

      - name: Import release signing key
        if: runner.os == 'Linux'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          FPR=$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          test "$FPR" = "$RELEASE_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          echo "RELEASE_GPG_FINGERPRINT=$FPR" >> "$GITHUB_ENV"

      - run: make install-web
      - run: make desktop-package

      - name: Sign RPM
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rpm=$(find desktop/dist -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$rpm"
          rpmsign --define "_gpg_name $RELEASE_GPG_FINGERPRINT" --define "_gpg_path $GNUPGHOME" --addsign "$rpm"
          signature=$(rpm -qp --qf '%{SIGPGP:pgpsig}' "$rpm")
          test "$signature" != "(none)"
          echo "RPM signed: $signature"

      - uses: actions/upload-artifact@v4
        with:
          name: contenox-desktop-${{ runner.os }}
          path: |
            desktop/dist/Contenox-*
            desktop/dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: contenox-desktop-*
          merge-multiple: true
          path: artifacts

      - name: Import release signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          FPR=$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          test "$FPR" = "$RELEASE_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          echo "RELEASE_GPG_FINGERPRINT=$FPR" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          cd artifacts
          find . -name SHA256SUMS -delete
          sha256sum Contenox-* > SHA256SUMS
          gpg --batch --homedir "$GNUPGHOME" --local-user "$RELEASE_GPG_FINGERPRINT" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          for artifact in Contenox-*; do
            gpg --batch --homedir "$GNUPGHOME" --local-user "$RELEASE_GPG_FINGERPRINT" --armor --detach-sign --output "$artifact.asc" "$artifact"
          done
          printf '%s\n' "$RELEASE_GPG_PUBLIC_KEY" > contenox-release.asc
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./*               --title "Contenox v${VERSION}"               --generate-notes
          fi
