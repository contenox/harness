name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - packages/**
      - runtime.lock.json
      - scripts/fetch-runtime.mjs
      - Makefile
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            packages/harness/package-lock.json
            packages/acp-client/package-lock.json
            website/package-lock.json
            desktop/package-lock.json

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm

      - run: make install-web
      - run: make desktop-package

      - uses: actions/upload-artifact@v4
        with:
          name: contenox-desktop-${{ runner.os }}
          path: |
            desktop/dist/Contenox-*
            desktop/dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: contenox-desktop-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          cd artifacts
          find . -name SHA256SUMS -delete
          sha256sum Contenox-* > SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./*               --title "Contenox v${VERSION}"               --generate-notes
          fi
