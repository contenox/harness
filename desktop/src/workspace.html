<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contenox</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #0a0a0a;
        color: #f4f4f5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .shell {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background:
          radial-gradient(900px 420px at 50% -10%, rgba(249, 115, 22, 0.12), transparent 70%),
          #0a0a0a;
      }
      .card {
        width: min(680px, 100%);
        border: 1px solid #27272a;
        border-radius: 18px;
        background: #111113;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        padding: 36px;
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .mark {
        width: 34px; height: 34px; border-radius: 10px;
        display: grid; place-items: center;
        background: #f97316; color: #0a0a0a;
        font-weight: 800; font-size: 18px;
      }
      .brand-name { font-weight: 700; letter-spacing: 0.16em; font-size: 13px; }
      h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.02em; }
      .lead { color: #a1a1aa; margin: 0 0 26px; max-width: 54ch; }
      button {
        font: inherit; cursor: pointer; border-radius: 10px;
        border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5;
        padding: 10px 14px;
      }
      button:hover { background: #27272a; }
      button.primary { background: #f97316; border-color: #f97316; color: #0a0a0a; font-weight: 700; }
      button.primary:hover { background: #fb923c; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .hint { color: #71717a; font-size: 12px; margin-top: 14px; }
      .recent { margin-top: 28px; border-top: 1px solid #27272a; padding-top: 20px; }
      .recent h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #71717a; margin: 0 0 10px; }
      .recent-list { display: grid; gap: 6px; }
      .recent-list button { text-align: left; width: 100%; overflow: hidden; }
      .recent-list strong { display: block; font-size: 13px; }
      .recent-list span { display: block; color: #71717a; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status { min-height: 20px; margin-top: 14px; color: #fca5a5; font-size: 12px; }
      .empty { color: #71717a; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <div class="brand">
          <div class="mark" aria-hidden="true">C</div>
          <div class="brand-name">CONTENOX</div>
        </div>
        <h1 id="title">Choose a workspace</h1>
        <p class="lead">Pick the folder Contenox may open and work in. The folder is used in place; nothing is created or moved.</p>
        <div class="actions">
          <button class="primary" id="open-folder" type="button">Open folder…</button>
          <button id="quit" type="button">Quit</button>
        </div>
        <p class="hint">You can change the workspace later from Projects → Open workspace.</p>
        <div id="status" role="status"></div>
        <section class="recent" aria-labelledby="recent-title">
          <h2 id="recent-title">Recent workspaces</h2>
          <div class="recent-list" id="recent-list"></div>
        </section>
      </section>
    </main>
    <script>
      const api = window.contenoxDesktop;
      const status = document.getElementById('status');
      const recentList = document.getElementById('recent-list');

      function showError(error) {
        status.textContent = error || 'Could not open that workspace.';
      }

      async function useWorkspace(workspace) {
        status.textContent = 'Opening ' + workspace + '…';
        const result = await api.useWorkspace(workspace);
        if (!result.ok) showError(result.error);
      }

      async function openFolder() {
        status.textContent = '';
        const workspace = await api.pickWorkspace();
        if (workspace) await useWorkspace(workspace);
      }

      function renderRecent(paths) {
        recentList.replaceChildren();
        if (!paths.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No recent workspaces yet.';
          recentList.append(empty);
          return;
        }
        for (const workspace of paths) {
          const button = document.createElement('button');
          button.type = 'button';
          const name = document.createElement('strong');
          name.textContent = workspace.split(/[\\/]/).filter(Boolean).pop() || workspace;
          const pathLabel = document.createElement('span');
          pathLabel.textContent = workspace;
          button.append(name, pathLabel);
          button.addEventListener('click', () => void useWorkspace(workspace));
          recentList.append(button);
        }
      }

      document.getElementById('open-folder').addEventListener('click', () => void openFolder());
      document.getElementById('quit').addEventListener('click', () => window.close());
      api?.recentWorkspaces?.().then(renderRecent).catch(() => renderRecent([]));
    </script>
  </body>
</html>
