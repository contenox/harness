<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contenox</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #0a0a0a;
        color: #f4f4f5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .shell {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background:
          radial-gradient(900px 420px at 50% -10%, rgba(249, 115, 22, 0.12), transparent 70%),
          #0a0a0a;
      }
      .card {
        width: min(680px, 100%);
        border: 1px solid #27272a;
        border-radius: 18px;
        background: #111113;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        padding: 36px;
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .mark {
        width: 34px; height: 34px; border-radius: 10px;
        display: grid; place-items: center;
        background: #f97316; color: #0a0a0a;
        font-weight: 800; font-size: 18px;
      }
      .brand-name { font-weight: 700; letter-spacing: 0.16em; font-size: 13px; }
      h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.02em; }
      .lead { color: #a1a1aa; margin: 0 0 26px; max-width: 54ch; }
      button {
        font: inherit; cursor: pointer; border-radius: 10px;
        border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5;
        padding: 10px 14px;
      }
      button:hover:not(:disabled) { background: #27272a; }
      button:disabled { opacity: 0.55; cursor: default; }
      button.primary { background: #f97316; border-color: #f97316; color: #0a0a0a; font-weight: 700; }
      button.primary:hover:not(:disabled) { background: #fb923c; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .hint { color: #71717a; font-size: 12px; margin-top: 14px; }
      .hint code {
        background: #18181b; border: 1px solid #27272a; border-radius: 5px;
        padding: 1px 5px; font-size: 11px; color: #d4d4d8;
      }
      .recent { margin-top: 28px; border-top: 1px solid #27272a; padding-top: 20px; }
      .recent h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #71717a; margin: 0 0 10px; }
      .recent-list { display: grid; gap: 6px; }
      .row { display: flex; gap: 6px; align-items: stretch; }
      .entry {
        flex: 1; min-width: 0; text-align: left; overflow: hidden;
        display: flex; flex-direction: column; gap: 2px; padding: 9px 12px;
      }
      .entry strong { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .entry span { display: block; color: #71717a; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
        color: #fdba74; border: 1px solid #7c2d12; background: #1c1310;
        border-radius: 999px; padding: 1px 7px; font-weight: 600;
      }
      .remove {
        width: 38px; display: grid; place-items: center; color: #a1a1aa;
        font-size: 16px; line-height: 1; padding: 0;
      }
      .remove:hover:not(:disabled) { color: #fca5a5; border-color: #7f1d1d; }
      #status { min-height: 20px; margin-top: 14px; color: #fca5a5; font-size: 12px; white-space: pre-wrap; }
      .empty { color: #71717a; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <div class="brand">
          <div class="mark" aria-hidden="true">C</div>
          <div class="brand-name">CONTENOX</div>
        </div>
        <h1 id="title">Choose a workspace</h1>
        <p class="lead">Pick the folder Contenox may open and work in. The folder is used in place; nothing is created or moved.</p>
        <div class="actions">
          <button class="primary" id="open-folder" type="button">Open Folder…</button>
          <button id="quit" type="button">Quit</button>
        </div>
        <p class="hint">Tip: run <code>contenox .</code> in any folder to open it here. Switch again at any time with <code>Ctrl/Cmd+O</code>.</p>
        <div id="status" role="status"></div>
        <section class="recent" aria-labelledby="recent-title">
          <h2 id="recent-title">Recent workspaces</h2>
          <div class="recent-list" id="recent-list"></div>
        </section>
      </section>
    </main>
    <script>
      const api = window.contenoxDesktop;
      const status = document.getElementById('status');
      const recentList = document.getElementById('recent-list');
      const openFolderButton = document.getElementById('open-folder');
      const quitButton = document.getElementById('quit');

      let current = null;
      let recent = [];
      let busy = false;

      function showError(text) {
        status.textContent = text || 'Could not open that workspace.';
      }

      function setBusy(value) {
        busy = value;
        openFolderButton.disabled = value;
        for (const button of recentList.querySelectorAll('button')) button.disabled = value;
      }

      async function useWorkspace(workspace) {
        if (busy) return;
        setBusy(true);
        status.textContent = 'Opening ' + workspace + '…';
        const result = await api.useWorkspace(workspace);
        if (!result.ok) {
          showError(result.error);
          setBusy(false);
        }
      }

      async function openFolder() {
        if (busy) return;
        status.textContent = '';
        const workspace = await api.pickWorkspace();
        if (workspace) await useWorkspace(workspace);
      }

      async function removeRecent(workspace) {
        if (busy) return;
        const name = workspace.split(/[\\/]/).filter(Boolean).pop() || workspace;
        if (!window.confirm(`Remove ${name} from recent workspaces?\n\nThe folder itself is not touched.`)) return;
        const result = await api.forgetRecent(workspace);
        if (!result.ok) {
          showError(result.error);
          return;
        }
        recent = result.recent;
        renderRecent();
      }

      function renderRecent() {
        recentList.replaceChildren();
        if (!recent.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No recent workspaces yet.';
          recentList.append(empty);
          return;
        }
        for (const workspace of recent) {
          const row = document.createElement('div');
          row.className = 'row';

          const entry = document.createElement('button');
          entry.type = 'button';
          entry.className = 'entry';
          entry.disabled = busy;

          const name = document.createElement('strong');
          name.textContent = workspace.split(/[\\/]/).filter(Boolean).pop() || workspace;
          if (workspace === current) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = 'current';
            name.append(badge);
          }

          const pathLabel = document.createElement('span');
          pathLabel.textContent = workspace;
          entry.append(name, pathLabel);
          entry.addEventListener('click', () => void useWorkspace(workspace));

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'remove';
          remove.title = 'Remove from recent workspaces';
          remove.setAttribute('aria-label', `Remove ${workspace} from recent workspaces`);
          remove.textContent = '×';
          remove.disabled = busy;
          remove.addEventListener('click', () => void removeRecent(workspace));

          row.append(entry, remove);
          recentList.append(row);
        }
      }

      async function load() {
        const [paths, active] = await Promise.all([api.recentWorkspaces(), api.currentWorkspace()]);
        recent = Array.isArray(paths) ? paths : [];
        current = active && active.ok ? active.workspace : null;
        renderRecent();
      }

      openFolderButton.addEventListener('click', () => void openFolder());
      quitButton.addEventListener('click', () => window.close());

      const error = new URLSearchParams(location.search).get('error');
      if (error) showError(error);

      load().catch(error => showError(error && error.message ? error.message : String(error)));
    </script>
  </body>
</html>
